edition: 3.0.0
name: gd-whitelist
access: "default"

vars:
  region: cn-hangzhou

# 只部署代码，不更新函数配置。函数配置在阿里云控制台上管理。
# 部署命令: s deploy --type code

services:
  # Web service (Egg.js PWA)
  gd-web:
    component: fc3
    props:
      region: ${vars.region}
      functionName: gd-web
      code: ./
      handler: index.handler

  # 定时更新白名单（复用已有函数 ecs-dsec）
  ecs-dsec:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ecs-dsec
      code: ./
      handler: index.handler
