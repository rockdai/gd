name: Publish gd image

# 合并到 main 且改动触及 job 镜像的输入时自动发布；也可手动触发（任意分支）。
# 产物：docker.io/rockdai/gd:latest + :sha-<short>，linux/amd64 + linux/arm64。
on:
  push:
    branches: [ main ]
    paths:
      - 'packages/job/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yaml'
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 的发布串行执行、按到达顺序排队（不取消进行中的）：两个 push 挨得近时，
# 保证最后写 latest 的是较新的那个；即使较新的一次失败，latest 也停在较新的成功提交上，而不是更早的状态。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # 只在上游仓库跑：fork 里没有对应 secrets，跑了也只会失败
    if: github.repository == 'rockdai/gd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 靠 QEMU 模拟；镜像里全是纯 JS 依赖，模拟下 npm ci 也就一两分钟
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: rockdai/gd
          # latest 只跟 main：手动在别的分支 dispatch 只会出 sha-<short>，不会覆盖生产 tag
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/job/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
