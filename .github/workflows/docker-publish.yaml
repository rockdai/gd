name: Publish gd image

# 合并到 main 且改动触及 job 镜像的输入时自动发布；也可手动触发（任意分支）。
# 产物：docker.io/rockdai/gd:latest + :sha-<short>，linux/amd64 + linux/arm64。
on:
  push:
    branches: [ main ]
    paths:
      - 'packages/job/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 靠 QEMU 模拟；镜像里全是纯 JS 依赖，模拟下 npm ci 也就一两分钟
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: rockdai/gd
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/job/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
