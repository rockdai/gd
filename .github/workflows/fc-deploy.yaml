name: Deploy to FC

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    # 只在上游仓库跑：fork 里没有对应 secrets，跑了也只会失败
    if: github.repository == 'rockdai/gd'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --production

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Deploy to FC
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
        run: |
          s config add --AccessKeyID "$ALIBABA_CLOUD_ACCESS_KEY_ID" --AccessKeySecret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" -a default
          s deploy --function code --assume-yes
