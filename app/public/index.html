<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1890ff">
  <meta name="description" content="阿里云机器白名单管理工具">
  <title>GD - 白名单管理</title>
  <link rel="manifest" href="/public/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    html {
      background: #f0f2f5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: hidden;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    body.app-locked .app-shell {
      visibility: hidden;
      pointer-events: none;
    }

    .header {
      background: linear-gradient(135deg, #1890ff, #096dd9);
      color: white;
      padding-top: calc(20px + env(safe-area-inset-top, 0px));
      padding-right: calc(88px + env(safe-area-inset-right, 0px));
      padding-bottom: 20px;
      padding-left: calc(20px + env(safe-area-inset-left, 0px));
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      flex-shrink: 0;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding-top: 16px;
      padding-right: calc(16px + env(safe-area-inset-right, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(16px + env(safe-area-inset-left, 0px));
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      width: 100%;
      min-width: 0;
    }

    .container::-webkit-scrollbar {
      display: none;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1890ff;
      overflow-wrap: anywhere;
    }

    .ip-display {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      min-width: 0;
    }

    .ip-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ip-value {
      font-size: 24px;
      font-weight: 700;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      color: #333;
      line-height: 1.2;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .ip-loading {
      color: #999;
      font-size: 16px;
      line-height: 1.4;
    }

    .ip-location {
      font-size: 12px;
      color: #999;
      line-height: 1.4;
      min-height: 17px;
      word-break: break-word;
    }

    .ip-refresh-btn {
      flex-shrink: 0;
      align-self: flex-start;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      max-width: 100%;
      white-space: normal;
      word-break: break-word;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #1890ff;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #096dd9;
    }

    .btn-success {
      background: #52c41a;
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background: #389e0d;
    }

    .btn-small {
      padding: 4px 12px;
      font-size: 13px;
    }

    .btn-block {
      display: flex;
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }

    .ip-input-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      width: 100%;
      min-width: 0;
    }

    .ip-input-group input {
      flex: 1;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      outline: none;
      transition: border-color 0.2s;
    }

    .ip-input-group input:focus {
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
    }

    .machine-list {
      list-style: none;
    }

    .machine-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }

    .machine-item:last-child {
      border-bottom: none;
    }

    .machine-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1890ff;
      flex-shrink: 0;
    }

    .machine-info {
      flex: 1;
      min-width: 0;
    }

    .machine-name {
      font-weight: 500;
      font-size: 14px;
      word-break: break-all;
    }

    .machine-meta {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    .machine-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .badge-ecs {
      background: #e6f7ff;
      color: #1890ff;
    }

    .badge-swas {
      background: #f6ffed;
      color: #52c41a;
    }

    .badge-status {
      background: #f0f0f0;
      color: #666;
    }

    .select-all {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 2px solid #f0f0f0;
      margin-bottom: 4px;
      font-size: 14px;
      color: #666;
    }

    .select-all input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1890ff;
    }

    .toast {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.error {
      background: #ff4d4f;
    }

    .toast.success {
      background: #52c41a;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: #999;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ccc;
      border-top-color: #1890ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-item {
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-success { color: #52c41a; }
    .result-error { color: #ff4d4f; }

    /* Login overlay */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: #f0f2f5;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-right: calc(16px + env(safe-area-inset-right, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(16px + env(safe-area-inset-left, 0px));
    }

    .login-overlay.hidden { display: none; }

    .login-card {
      background: white;
      border-radius: 12px;
      padding: 32px 28px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      text-align: center;
    }

    .login-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 8px 0 4px;
      color: #999;
      font-size: 14px;
    }

    .login-card h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .login-hint {
      color: #999;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .login-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .login-input:focus {
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
    }

    .login-error {
      color: #ff4d4f;
      font-size: 13px;
      margin-top: 12px;
    }

    .login-divider {
      color: #999;
      font-size: 13px;
      margin: 10px 0 14px;
    }

    .passkey-card-hint {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 16px;
    }

    .passkey-export {
      margin-top: 16px;
      text-align: left;
    }

    .passkey-export-label {
      color: #666;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .passkey-export-textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      box-sizing: border-box;
      font-family: Menlo, Monaco, Consolas, monospace;
    }

    /* Logout button in header */
    .btn-logout {
      position: absolute;
      right: calc(16px + env(safe-area-inset-right, 0px));
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover { background: rgba(255,255,255,0.35); }

    .header { position: relative; }

    /* Collapsible section for tagged machines */
    .collapsed-section {
      border-top: 1px dashed #d9d9d9;
      margin-top: 8px;
      padding-top: 4px;
    }

    .collapsed-toggle {
      display: flex;
      align-items: center;
      padding: 8px 0;
      cursor: pointer;
      font-size: 13px;
      color: #999;
      user-select: none;
      gap: 4px;
    }

    .collapsed-toggle:active {
      opacity: 0.7;
    }

    .collapsed-toggle .arrow {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 10px;
    }

    .collapsed-toggle .arrow.expanded {
      transform: rotate(90deg);
    }

    .collapsed-machines {
      display: none;
    }

    .collapsed-machines.expanded {
      display: block;
    }

    @media (max-width: 480px) {
      .ip-display {
        flex-wrap: wrap;
      }

      .ip-refresh-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body class="app-locked">
  <div class="app-shell">
    <div class="header">
      <h1>🛡️ GD - 白名单管理</h1>
      <button id="logoutBtn" class="btn-logout" style="display:none;" onclick="logout()">退出登录</button>
    </div>

    <div class="container">
      <!-- Current IP Card -->
      <div class="card">
        <div class="card-title">当前公网 IP</div>
        <div class="ip-display">
          <div class="ip-info">
            <span id="currentIp" class="ip-loading">获取中...</span>
            <span id="ipLocation" class="ip-location"></span>
          </div>
          <button class="btn btn-small btn-primary ip-refresh-btn" onclick="refreshIp()">刷新</button>
        </div>
        <div class="ip-input-group">
          <input type="text" id="customIp" placeholder="输入指定 IP（留空使用当前 IP）" />
        </div>
      </div>

      <!-- Machine List Card -->
      <div class="card">
        <div class="card-title">
          机器列表
          <button class="btn btn-small btn-primary" onclick="refreshMachines()" style="margin-left: 8px;">刷新</button>
        </div>
        <div id="machineListContainer">
          <div class="empty-state">
            <div class="loading-spinner"></div>
            <p style="margin-top: 8px;">加载机器列表...</p>
          </div>
        </div>
      </div>

      <!-- Action Card -->
      <div class="card">
        <button id="submitBtn" class="btn btn-success btn-block" onclick="addToWhitelist()" disabled>
          🚀 一键添加到白名单
        </button>
      </div>

      <div class="card" id="passkeyCard" style="display:none;">
        <div class="card-title">Face ID / Passkey</div>
        <p id="passkeyCardHint" class="passkey-card-hint">
          绑定当前设备后，系统会返回一段 JSON。把它写入 `PASSKEY_CREDENTIALS_JSON` 并重启服务后，这台设备才能用于 Face ID 登录。
        </p>
        <button id="enrollPasskeyBtn" class="btn btn-primary btn-block" onclick="enrollPasskey()">
          绑定当前设备
        </button>
        <div id="passkeyExportWrap" class="passkey-export" style="display:none;">
          <div class="passkey-export-label">将下面的值写入环境变量 `PASSKEY_CREDENTIALS_JSON` 后重启服务：</div>
          <textarea id="passkeyExportValue" class="passkey-export-textarea" readonly></textarea>
        </div>
      </div>

      <!-- Result Card (hidden by default) -->
      <div class="card" id="resultCard" style="display: none;">
        <div class="card-title">执行结果</div>
        <div id="resultContainer"></div>
      </div>
    </div>
  </div>

  <!-- Login overlay -->
  <div id="loginOverlay" class="login-overlay">
    <div id="loginCard" class="login-card">
      <h2 id="loginTitle">🔐 身份验证</h2>
      <p id="loginHint" class="login-hint">请输入访问密码以继续</p>
      <div id="loginLoading" class="login-loading" style="display:none;">
        <div class="loading-spinner"></div>
        <span>正在恢复登录状态，请稍候...</span>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <input type="password" id="loginPassword" class="login-input" placeholder="输入密码" autocomplete="current-password" required />
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">登录</button>
      </form>
      <div id="loginDivider" class="login-divider" style="display:none;">或</div>
      <button type="button" id="passkeyLoginBtn" class="btn btn-success btn-block" style="display:none;" onclick="handlePasskeyLogin()">
        使用 Face ID 登录
      </button>
      <p id="loginError" class="login-error" style="display:none;"></p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let currentIp = '';
    let machines = [];
    let authToken = localStorage.getItem('gd_token') || '';
    let loginViewportHandler = null;
    let authStatus = {
      passkeyReady: false,
      passkeyConfigured: false,
      passkeyEnrollmentEnabled: false,
      approvedCredentialCount: 0,
    };

    // =========== Auth helpers ===========

    function authHeaders() {
      return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
    }

    function setAppLocked(locked) {
      document.body.classList.toggle('app-locked', locked);
    }

    function supportsWebAuthn() {
      return !!(window.PublicKeyCredential && navigator.credentials);
    }

    function setLoginError(message) {
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = message || '';
      errorEl.style.display = message ? 'block' : 'none';
    }

    function setPasskeyExport(value) {
      const wrapEl = document.getElementById('passkeyExportWrap');
      const textareaEl = document.getElementById('passkeyExportValue');
      const text = value || '';
      textareaEl.value = text;
      wrapEl.style.display = text ? 'block' : 'none';
    }

    function updatePasskeyCard() {
      const cardEl = document.getElementById('passkeyCard');
      const hintEl = document.getElementById('passkeyCardHint');
      const enrollBtn = document.getElementById('enrollPasskeyBtn');
      const canShow = !!authToken && authStatus.passkeyReady && authStatus.passkeyEnrollmentEnabled;

      cardEl.style.display = canShow ? 'block' : 'none';
      if (!canShow) return;

      hintEl.textContent = authStatus.approvedCredentialCount > 0
        ? '已批准 ' + authStatus.approvedCredentialCount + ' 个设备。绑定新设备后，需要把导出的 JSON 写回 PASSKEY_CREDENTIALS_JSON 并重启服务。'
        : '当前还没有已批准的设备。先在当前设备完成绑定，再把导出的 JSON 写入 PASSKEY_CREDENTIALS_JSON 并重启服务。';

      enrollBtn.disabled = !supportsWebAuthn();
      enrollBtn.textContent = supportsWebAuthn() ? '绑定当前设备' : '当前浏览器不支持 Face ID / Passkey';
    }

    async function refreshAuthStatus() {
      try {
        const resp = await fetch('/api/auth/status', { cache: 'no-store' });
        const data = await resp.json();
        if (data.success) {
          authStatus = {
            passkeyReady: !!data.passkeyReady,
            passkeyConfigured: !!data.passkeyConfigured,
            passkeyEnrollmentEnabled: !!data.passkeyEnrollmentEnabled,
            approvedCredentialCount: Number(data.approvedCredentialCount || 0),
          };
        }
      } catch (err) {
        console.warn('Failed to fetch auth status:', err);
      }

      updatePasskeyCard();
    }

    function setLoginOverlayMode(mode) {
      const titleEl = document.getElementById('loginTitle');
      const hintEl = document.getElementById('loginHint');
      const formEl = document.getElementById('loginForm');
      const loadingEl = document.getElementById('loginLoading');
      const dividerEl = document.getElementById('loginDivider');
      const passkeyBtn = document.getElementById('passkeyLoginBtn');
      const passwordInput = document.getElementById('loginPassword');

      if (mode === 'loading') {
        titleEl.textContent = '正在验证';
        hintEl.textContent = '正在恢复登录状态，请稍候...';
        formEl.style.display = 'none';
        loadingEl.style.display = 'flex';
        dividerEl.style.display = 'none';
        passkeyBtn.style.display = 'none';
        setLoginError('');
        return;
      }

      titleEl.textContent = '🔐 身份验证';
      const passkeySupported = supportsWebAuthn();
      const hasApprovedPasskey = authStatus.passkeyReady && authStatus.passkeyConfigured;
      const showPasskeyButton = hasApprovedPasskey;
      const canUsePasskey = hasApprovedPasskey && passkeySupported;

      if (hasApprovedPasskey) {
        hintEl.textContent = passkeySupported
          ? '可以使用密码登录，或使用已批准的 Face ID / Passkey。'
          : '当前浏览器不支持 Face ID / Passkey，仍可使用密码登录。';
      } else {
        hintEl.textContent = '请输入访问密码以继续。';
      }

      formEl.style.display = 'block';
      loadingEl.style.display = 'none';
      dividerEl.style.display = showPasskeyButton ? 'block' : 'none';
      passkeyBtn.style.display = showPasskeyButton ? 'block' : 'none';
      passkeyBtn.disabled = !canUsePasskey;
      passkeyBtn.textContent = canUsePasskey ? '使用 Face ID 登录' : '当前浏览器不支持 Face ID / Passkey';
      passwordInput.required = true;
      setLoginError('');
    }

    /** Authenticated fetch wrapper – redirects to login on 401 */
    async function authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers || {}, authHeaders());
      const resp = await fetch(url, opts);
      if (resp.status === 401) {
        // Token expired or invalid
        authToken = '';
        localStorage.removeItem('gd_token');
        updatePasskeyCard();
        showLoginOverlay('login');
        throw new Error('AUTH_REQUIRED');
      }
      return resp;
    }

    function setupLoginViewportListeners() {
      if (!window.visualViewport || loginViewportHandler) return;
      loginViewportHandler = () => {
        const overlay = document.getElementById('loginOverlay');
        if (!overlay || overlay.classList.contains('hidden')) return;
        const vv = window.visualViewport;
        overlay.style.height = vv.height + 'px';
        overlay.style.top = vv.offsetTop + 'px';
      };
      window.visualViewport.addEventListener('resize', loginViewportHandler);
      window.visualViewport.addEventListener('scroll', loginViewportHandler);
      loginViewportHandler();
    }

    function removeLoginViewportListeners() {
      if (!window.visualViewport || !loginViewportHandler) return;
      window.visualViewport.removeEventListener('resize', loginViewportHandler);
      window.visualViewport.removeEventListener('scroll', loginViewportHandler);
      loginViewportHandler = null;
      const overlay = document.getElementById('loginOverlay');
      if (overlay) {
        overlay.style.height = '';
        overlay.style.top = '';
      }
    }

    function showLoginOverlay(mode = 'login') {
      setLoginOverlayMode(mode);
      document.getElementById('loginOverlay').classList.remove('hidden');
      setAppLocked(true);
      document.getElementById('logoutBtn').style.display = 'none';
      setupLoginViewportListeners();
      if (mode === 'login') {
        document.getElementById('loginPassword').focus();
      }
    }

    function hideLoginOverlay() {
      document.getElementById('loginOverlay').classList.add('hidden');
      setAppLocked(false);
      document.getElementById('logoutBtn').style.display = 'block';
      removeLoginViewportListeners();
    }

    function storeAuthToken(token) {
      authToken = token;
      localStorage.setItem('gd_token', authToken);
      updatePasskeyCard();
    }

    async function finishLogin(token) {
      storeAuthToken(token);
      hideLoginOverlay();
      refreshIp();
      refreshMachines();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.textContent = '登录中...';
      setLoginError('');

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await resp.json();

        if (data.success && data.token) {
          await finishLogin(data.token);
        } else {
          setLoginError(data.message || '登录失败');
        }
      } catch (err) {
        setLoginError('网络错误，请重试');
      }

      btn.disabled = false;
      btn.textContent = '登录';
    }

    function base64UrlToUint8Array(base64url) {
      const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function arrayBufferToBase64Url(buffer) {
      const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function decodeCreationOptions(optionsJSON) {
      const options = Object.assign({}, optionsJSON);
      options.challenge = base64UrlToUint8Array(optionsJSON.challenge);
      options.user = Object.assign({}, optionsJSON.user, {
        id: base64UrlToUint8Array(optionsJSON.user.id),
      });
      if (Array.isArray(optionsJSON.excludeCredentials)) {
        options.excludeCredentials = optionsJSON.excludeCredentials.map(credential => Object.assign({}, credential, {
          id: base64UrlToUint8Array(credential.id),
        }));
      }
      return options;
    }

    function decodeRequestOptions(optionsJSON) {
      const options = Object.assign({}, optionsJSON);
      options.challenge = base64UrlToUint8Array(optionsJSON.challenge);
      if (Array.isArray(optionsJSON.allowCredentials)) {
        options.allowCredentials = optionsJSON.allowCredentials.map(credential => Object.assign({}, credential, {
          id: base64UrlToUint8Array(credential.id),
        }));
      }
      return options;
    }

    function serializeRegistrationCredential(credential) {
      return {
        id: credential.id,
        rawId: arrayBufferToBase64Url(credential.rawId),
        type: credential.type,
        authenticatorAttachment: credential.authenticatorAttachment,
        clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {},
        response: {
          attestationObject: arrayBufferToBase64Url(credential.response.attestationObject),
          clientDataJSON: arrayBufferToBase64Url(credential.response.clientDataJSON),
          transports: credential.response.getTransports ? credential.response.getTransports() : [],
          publicKey: credential.response.getPublicKey ? arrayBufferToBase64Url(credential.response.getPublicKey()) : undefined,
          publicKeyAlgorithm: credential.response.getPublicKeyAlgorithm ? credential.response.getPublicKeyAlgorithm() : undefined,
        },
      };
    }

    function serializeAuthenticationCredential(credential) {
      return {
        id: credential.id,
        rawId: arrayBufferToBase64Url(credential.rawId),
        type: credential.type,
        authenticatorAttachment: credential.authenticatorAttachment,
        clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {},
        response: {
          authenticatorData: arrayBufferToBase64Url(credential.response.authenticatorData),
          clientDataJSON: arrayBufferToBase64Url(credential.response.clientDataJSON),
          signature: arrayBufferToBase64Url(credential.response.signature),
          userHandle: credential.response.userHandle ? arrayBufferToBase64Url(credential.response.userHandle) : undefined,
        },
      };
    }

    async function handlePasskeyLogin() {
      if (!supportsWebAuthn()) {
        setLoginError('当前浏览器不支持 Face ID / Passkey 登录');
        return;
      }

      const btn = document.getElementById('passkeyLoginBtn');
      btn.disabled = true;
      btn.textContent = '验证中...';
      setLoginError('');

      try {
        const optionsResp = await fetch('/api/passkey/auth/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        const optionsData = await optionsResp.json();
        if (!optionsData.success) {
          throw new Error(optionsData.message || '无法发起 Face ID / Passkey 登录');
        }

        const credential = await navigator.credentials.get({
          publicKey: decodeRequestOptions(optionsData.optionsJSON),
        });
        if (!credential) {
          throw new Error('已取消 Face ID / Passkey 登录');
        }

        const verifyResp = await fetch('/api/passkey/auth/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            credential: serializeAuthenticationCredential(credential),
            flowToken: optionsData.flowToken,
          }),
        });
        const verifyData = await verifyResp.json();
        if (!verifyData.success || !verifyData.token) {
          throw new Error(verifyData.message || 'Face ID / Passkey 登录失败');
        }

        await finishLogin(verifyData.token);
      } catch (err) {
        setLoginError(err.message || 'Face ID / Passkey 登录失败');
      } finally {
        btn.disabled = !supportsWebAuthn();
        btn.textContent = supportsWebAuthn() ? '使用 Face ID 登录' : '当前浏览器不支持 Face ID / Passkey';
      }
    }

    async function enrollPasskey() {
      if (!supportsWebAuthn()) {
        showToast('当前浏览器不支持 Face ID / Passkey 绑定', 'error');
        return;
      }

      const btn = document.getElementById('enrollPasskeyBtn');
      btn.disabled = true;
      btn.textContent = '绑定中...';
      setPasskeyExport('');

      try {
        const optionsResp = await authFetch('/api/passkey/register/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        const optionsData = await optionsResp.json();
        if (!optionsData.success) {
          throw new Error(optionsData.message || '无法发起当前设备绑定');
        }

        const credential = await navigator.credentials.create({
          publicKey: decodeCreationOptions(optionsData.optionsJSON),
        });
        if (!credential) {
          throw new Error('已取消当前设备绑定');
        }

        const verifyResp = await authFetch('/api/passkey/register/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            credential: serializeRegistrationCredential(credential),
            flowToken: optionsData.flowToken,
          }),
        });
        const verifyData = await verifyResp.json();
        if (!verifyData.success) {
          throw new Error(verifyData.message || '无法完成当前设备绑定');
        }

        setPasskeyExport(verifyData.approvedCredentialsJson || '');
        showToast('当前设备已完成绑定验证。把返回 JSON 写入 PASSKEY_CREDENTIALS_JSON 并重启服务后即可使用 Face ID 登录。', 'success');
      } catch (err) {
        if (err.message !== 'AUTH_REQUIRED') {
          showToast(err.message || '无法完成当前设备绑定', 'error');
        }
      } finally {
        btn.disabled = !supportsWebAuthn();
        btn.textContent = supportsWebAuthn() ? '绑定当前设备' : '当前浏览器不支持 Face ID / Passkey';
      }
    }

    function logout() {
      authToken = '';
      localStorage.removeItem('gd_token');
      machines = [];
      currentIp = '';
      setPasskeyExport('');
      document.getElementById('machineListContainer').innerHTML = '<div class="empty-state">请先登录</div>';
      document.getElementById('currentIp').textContent = '-';
      document.getElementById('ipLocation').textContent = '';
      updatePasskeyCard();
      showLoginOverlay();
    }

    // =========== Initialize ===========

    document.addEventListener('DOMContentLoaded', async () => {
      await refreshAuthStatus();

      if (authToken) {
        showLoginOverlay('loading');
        const machineResult = await refreshMachines();
        if (machineResult.success) {
          hideLoginOverlay();
          updatePasskeyCard();
          refreshIp();
        } else if (machineResult.authRequired) {
          showLoginOverlay('login');
        } else {
          hideLoginOverlay();
        }
      } else {
        showLoginOverlay('login');
      }

      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/public/sw.js').catch(err => {
          console.warn('Service worker registration failed:', err);
        });
      }
    });

    // =========== IP & Machine logic ===========

    async function refreshIp() {
      const el = document.getElementById('currentIp');
      const locEl = document.getElementById('ipLocation');
      el.className = 'ip-loading';
      el.textContent = '获取中...';
      locEl.textContent = '';

      try {
        // Fetch public IP directly from the browser so we get the client's real IP
        const resp = await fetch('https://get-ip.rockdai.com', { headers: { accept: 'text/plain' } });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();
        const m = text.match(/\b(\d{1,3}(?:\.\d{1,3}){3})\b/);
        if (!m) throw new Error('无法解析 IP');
        currentIp = m[1];
        el.className = 'ip-value';
        el.textContent = currentIp;

        // Best-effort: resolve IP geolocation through our backend so the AMap key stays server-side.
        const fetchedIp = currentIp;
        authFetch('/api/ip-location?ip=' + encodeURIComponent(fetchedIp))
          .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
          .then(function (data) {
            if (currentIp !== fetchedIp) return; // stale response
            if (data.success && data.location) locEl.textContent = data.location;
          })
          .catch(function (err) {
            if (err && err.message !== 'AUTH_REQUIRED') {
              console.warn('Failed to fetch IP geolocation:', err);
            }
          });
      } catch (err) {
        el.textContent = '获取失败';
        showToast('无法获取公网 IP: ' + err.message, 'error');
      }

      updateSubmitBtn();
    }

    async function refreshMachines() {
      const container = document.getElementById('machineListContainer');
      container.innerHTML = '<div class="empty-state"><div class="loading-spinner"></div><p style="margin-top: 8px;">加载机器列表...</p></div>';

      try {
        const resp = await authFetch('/api/machines');
        const data = await resp.json();
        if (data.success) {
          machines = data.machines || [];
          renderMachines();
          updateSubmitBtn();
          return { success: true, authRequired: false };
        } else {
          container.innerHTML = '<div class="empty-state">加载失败: ' + escapeHtml(data.message) + '</div>';
        }
      } catch (err) {
        if (err.message === 'AUTH_REQUIRED') {
          return { success: false, authRequired: true };
        }
        container.innerHTML = '<div class="empty-state">网络错误，无法加载机器列表</div>';
      }

      updateSubmitBtn();
      return { success: false, authRequired: false };
    }

    function renderMachines() {
      const container = document.getElementById('machineListContainer');

      if (machines.length === 0) {
        container.innerHTML = '<div class="empty-state">未找到机器实例</div>';
        return;
      }

      const normalMachines = [];
      const taggedMachines = [];
      machines.forEach((m, i) => {
        const isCollapsed = (m.tags || []).some(t => t.key === 'app' && t.value === 'gfw');
        if (isCollapsed) {
          taggedMachines.push({ machine: m, index: i });
        } else {
          normalMachines.push({ machine: m, index: i });
        }
      });

      let html = '';
      html += '<div class="select-all">';
      html += '<input type="checkbox" id="selectAll" onchange="toggleSelectAll()" />';
      const visibleCount = normalMachines.length;
      const totalCount = machines.length;
      const countLabel = taggedMachines.length > 0
        ? visibleCount + ' / ' + totalCount + ' 台机器'
        : totalCount + ' 台机器';
      html += '<label for="selectAll">全选 (' + countLabel + ')</label>';
      html += '</div>';
      html += '<ul class="machine-list">';

      normalMachines.forEach(({ machine: m, index: i }) => {
        html += renderMachineItem(m, i);
      });

      html += '</ul>';

      if (taggedMachines.length > 0) {
        html += '<div class="collapsed-section">';
        html += '<div class="collapsed-toggle" id="collapsedToggle" role="button" tabindex="0" aria-expanded="false" aria-controls="collapsedMachines" onclick="toggleCollapsedSection()" onkeydown="handleCollapsedToggleKey(event)">';
        html += '<span class="arrow" id="collapsedArrow">▶</span>';
        html += ' 更多机器 (' + taggedMachines.length + ' 台)';
        html += '</div>';
        html += '<ul class="machine-list collapsed-machines" id="collapsedMachines">';
        taggedMachines.forEach(({ machine: m, index: i }) => {
          html += renderMachineItem(m, i);
        });
        html += '</ul>';
        html += '</div>';
      }

      container.innerHTML = html;
      updateSelectAllState();
    }

    function renderMachineItem(m, i) {
      const badgeClass = m.product === 'ecs' ? 'badge-ecs' : 'badge-swas';
      const productLabel = m.product === 'ecs' ? 'ECS' : '轻量服务器';
      const ips = (m.publicIpAddress || []).join(', ') || '无公网 IP';
      let html = '<li class="machine-item">';
      html += '<input type="checkbox" class="machine-checkbox" data-index="' + i + '" onchange="handleMachineCheckboxChange()" />';
      html += '<div class="machine-info">';
      html += '<div class="machine-name">' + escapeHtml(m.instanceName) + '</div>';
      html += '<div class="machine-meta">' + escapeHtml(m.regionId) + ' · ' + escapeHtml(ips) + '</div>';
      html += '<div class="machine-meta">' + escapeHtml(m.instanceId) + '</div>';
      html += '</div>';
      html += '<span class="machine-badge ' + badgeClass + '">' + productLabel + '</span>';
      html += '</li>';
      return html;
    }

    function toggleCollapsedSection() {
      const container = document.getElementById('collapsedMachines');
      const arrow = document.getElementById('collapsedArrow');
      const toggle = document.getElementById('collapsedToggle');
      if (!container) return;
      const expanded = container.classList.toggle('expanded');
      if (arrow) arrow.classList.toggle('expanded', expanded);
      if (toggle) toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      updateSelectAllState();
    }

    function handleCollapsedToggleKey(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleCollapsedSection();
      }
    }

    function getVisibleCheckboxes() {
      const collapsedContainer = document.getElementById('collapsedMachines');
      const collapsedHidden = collapsedContainer && !collapsedContainer.classList.contains('expanded');
      return Array.from(document.querySelectorAll('.machine-checkbox')).filter(cb => {
        return !(collapsedHidden && collapsedContainer.contains(cb));
      });
    }

    function toggleSelectAll() {
      const selectAll = document.getElementById('selectAll');
      const checked = selectAll ? selectAll.checked : false;
      getVisibleCheckboxes().forEach(cb => {
        cb.checked = checked;
      });
      updateSelectAllState();
      updateSubmitBtn();
    }

    function updateSelectAllState() {
      const selectAll = document.getElementById('selectAll');
      if (!selectAll) return;
      const visibleCheckboxes = getVisibleCheckboxes();
      if (visibleCheckboxes.length === 0) {
        selectAll.checked = false;
        selectAll.indeterminate = false;
        return;
      }
      const checkedCount = visibleCheckboxes.filter(cb => cb.checked).length;
      selectAll.checked = checkedCount === visibleCheckboxes.length;
      selectAll.indeterminate = checkedCount > 0 && checkedCount < visibleCheckboxes.length;
    }

    function handleMachineCheckboxChange() {
      updateSelectAllState();
      updateSubmitBtn();
    }

    function getSelectedMachines() {
      const selected = [];
      document.querySelectorAll('.machine-checkbox:checked').forEach(cb => {
        const idx = parseInt(cb.dataset.index, 10);
        if (machines[idx]) selected.push(machines[idx]);
      });
      return selected;
    }

    function updateSubmitBtn() {
      const btn = document.getElementById('submitBtn');
      const selected = getSelectedMachines();
      const ip = document.getElementById('customIp').value.trim() || currentIp;
      btn.disabled = !ip || selected.length === 0;
      btn.textContent = selected.length > 0
        ? '🚀 添加到 ' + selected.length + ' 台机器的白名单'
        : '🚀 一键添加到白名单';
    }

    async function addToWhitelist() {
      const ip = document.getElementById('customIp').value.trim() || currentIp;
      const selected = getSelectedMachines();

      if (!ip || selected.length === 0) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 添加中...';

      try {
        const body = {
          ip,
          machines: selected.map(m => ({
            product: m.product,
            instanceId: m.instanceId,
            regionId: m.regionId,
            securityGroupId: m.securityGroupIds ? m.securityGroupIds[0] : undefined,
          })),
        };

        const resp = await authFetch('/api/whitelist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const data = await resp.json();
        if (data.success) {
          showResults(data.results);
          showToast('白名单添加完成', 'success');
        } else {
          showToast(data.message || '添加失败', 'error');
        }
      } catch (err) {
        if (err.message === 'AUTH_REQUIRED') return;
        showToast('网络错误', 'error');
      }

      updateSubmitBtn();
    }

    // =========== UI helpers ===========

    function showResults(results) {
      const card = document.getElementById('resultCard');
      const container = document.getElementById('resultContainer');
      card.style.display = 'block';

      let html = '';
      for (const r of results) {
        const cls = r.status === 'success' ? 'result-success' : 'result-error';
        const icon = r.status === 'success' ? '✅' : '❌';
        html += '<div class="result-item ' + cls + '">';
        html += icon + ' ' + escapeHtml(r.instanceId) + ' (' + escapeHtml(r.regionId) + ') - ' + escapeHtml(r.message);
        html += '</div>';
      }
      container.innerHTML = html;
    }

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (type ? ' ' + type : '');
      setTimeout(() => {
        toast.className = 'toast';
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Listen to custom IP input changes
    document.addEventListener('input', (e) => {
      if (e.target.id === 'customIp') updateSubmitBtn();
    });
  </script>
</body>
</html>
